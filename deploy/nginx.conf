worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 14m;
    sendfile on;
    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        add_header X-Content-Type-Options nosniff always;

        # Uploads (public/storage -> storage/app/public): static only, never PHP.
        location ^~ /storage/ {
            location ~* \.(php[0-9]?|phtml|phar|pht|phps|inc)$ { return 403; }
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            try_files $uri =404;
        }
        location ~ /\.(?!well-known) { deny all; }

        location / { try_files $uri $uri/ /index.php?$query_string; }

        # Only the front controller is executed; any other .php path is refused.
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 90s;
        }
        location ~ \.php$ { return 404; }
    }
}
